[package]
name = "kachat-webserver"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"] }
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
tower = "0.5.2"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
hex = "0.4"
sha2 = "0.10"
# .kachat names: key = blake3(name) (KACHAT_NAMES_INDEXER.md §B1).
blake3 = "1"
# .kachat names read API: status rules shared with the follower, address <-> key.
kachat-names = { path = "../kachat-names" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa.git" }
clap = { version = "4.5.48", features = ["derive", "env"] }
axum-prometheus = "0.9"
base64ct = { version = "1.8.0", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# §5.10 scheduled posts: verify the schedule/cancel request signatures (schnorr over Kaspa's
# PersonalMessageSigningHash) using the exact same path the processor uses — no reimplemented crypto.
kaspa-wallet-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", features = ["wasm32-sdk"] }
secp256k1 = "0.29"
# §5.10: recompute a scheduled transaction's id (no tag: unifies with kaspa-wallet-core's rev).
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa.git" }
base64 = "0.21"
# kachat-audits IDX-019: /schedule-post checks each input is an unspent coin of the poster's
# address (getUtxosByAddresses over wRPC). No tag: same rev as the processor and names follower.
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa.git" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa.git" }
