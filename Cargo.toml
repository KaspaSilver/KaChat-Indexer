[workspace]
members = [
    "kachat-transaction-processor",
    "kachat-webserver",
    "kachat-database-cleaner",
    "kachat-content-remover",
    "kachat-admin"
]
# Emergency-only recovery tool; not part of normal builds (own deps: fjall). See its README.
exclude = ["tools/reseed-metadata"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"