# Emergency-only tool. NOT part of the main workspace (see root Cargo.toml `exclude`).
# Build it standalone with a musl target so it runs inside the alpine kachat-app container:
#   rustup target add x86_64-unknown-linux-musl
#   cargo build --release --target x86_64-unknown-linux-musl
# See ../../docs/RECOVERY-chat-metadata.md for the full procedure.
[package]
name = "reseed-metadata"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pin to the exact fjall the chat indexer uses so the on-disk format matches.
fjall = "=2.11.2"

[profile.release]
opt-level = 2
