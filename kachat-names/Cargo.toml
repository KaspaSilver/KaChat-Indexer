[package]
name = "kachat-names"
version.workspace = true
edition.workspace = true

# Pure codec + transition engine for the .kachat names registry (KACHAT_NAMES_INDEXER.md).
# No Kaspa deps: P2SH is plain BLAKE2b-256 (matching rusty-kaspa's
# pay_to_script_hash_script), keys are blake3. The indexer's chain follower + REST
# API build on this. TDD'd against the kachat-domains `kachat-names-vectors` output.
[dependencies]
blake3 = "1"
blake2b_simd = "1"
hex = "0.4"
# Profile records (kchat:1:profile:<json>, §C / 2026-10-02 format).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
