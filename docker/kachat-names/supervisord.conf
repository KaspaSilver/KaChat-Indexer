; .kachat Domains server — names follower + profiles follower + names-only webserver.
; Postgres runs in its own container. Every process logs to stdout, so the container's
; log is the whole story (the names follower tags its lines [names], profiles [profiles]).
; supervisord stays root (it owns the container's stdout); every program runs as the
; unprivileged `kachat` user (kachat-audits IDX-011). Nothing here writes to disk.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:names]
command=/app/run-names.sh
priority=100
autostart=true
autorestart=true
startretries=1000000
startsecs=3
stopsignal=INT
user=kachat
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:profiles]
command=/app/run-profiles.sh
priority=100
autostart=true
autorestart=true
startretries=1000000
startsecs=3
stopsignal=INT
user=kachat
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webserver]
command=/app/run-webserver.sh
priority=200
autostart=true
autorestart=true
startretries=1000000
startsecs=3
stopsignal=INT
user=kachat
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
