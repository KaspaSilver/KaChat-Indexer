; KaChat Indexer app container — runs the block ingester + processor + webserver + admin +
; chat indexer as supervised processes. Postgres runs in its own container (kachat-db).
; Each process auto-restarts (with high startretries so it rides out the DB coming up), and
; logs to the container's stdout so `docker logs kachat-app` shows everything.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Control socket so `docker exec kachat-app supervisorctl status|restart <proc>` works.
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:ingest]
command=/app/run-ingest.sh
priority=100
autostart=true
autorestart=true
startretries=1000000
startsecs=3
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chat]
command=/app/run-chat.sh
priority=100
autostart=true
autorestart=true
startretries=1000000
startsecs=3
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:processor]
command=/app/run-processor.sh
priority=200
autostart=true
autorestart=true
startretries=1000000
startsecs=3
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webserver]
command=/app/run-webserver.sh
priority=300
autostart=true
autorestart=true
startretries=1000000
startsecs=3
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:admin]
command=/app/run-admin.sh
priority=300
autostart=true
autorestart=true
startretries=1000000
startsecs=3
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
