# ============================================================================
# KaChat Indexer — self-host stack (one command brings up everything)
# ============================================================================
# This is the turnkey, self-contained stack used by ../../../install.sh. Unlike the
# operator compose in ../compose.yaml (which reuses this box's node, keys, and imported
# history), this file downloads and runs its OWN Kaspa node and stores everything in
# named Docker volumes, so a stranger with only Docker installed gets a working KaChat
# Indexer from a single command.
#
# What runs:
#   kaspad               — full Kaspa node (rusty-kaspad), the chain source
#   kachat-db            — Postgres 17 (KaPosts / broadcast tables)
#   kachat-app           — block ingester + KaChat processor + webserver + chat indexer + admin
#   nginx-proxy-manager  — optional HTTPS front door         (profile: proxy)
#   portainer            — optional Docker monitoring UI      (profile: monitor)
#
# The three core services use host networking (Linux / WSL2), so the node's RPC binds
# straight to the host on 16110 (gRPC) + 17110 (BORSH wRPC) — meaning you can point your
# own tools at your own node. Postgres and the app reach the node over 127.0.0.1.
#
# Bring up:   docker compose --profile proxy --profile monitor up -d --build
# Tear down:  docker compose --profile proxy --profile monitor down -v
# (install.sh / uninstall.sh do this for you and skip proxy/monitor if you already run them.)
name: kachat

services:
  # --- Kaspa node: the chain source. Ships with exactly the RPC we need ----------------
  # Image default CMD is already: kaspad --yes --nologfiles --disable-upnp --utxoindex
  #   --rpclisten=0.0.0.0:16110 --rpclisten-borsh=0.0.0.0:17110 --rpclisten-json=0.0.0.0:18110
  # so 16110 (gRPC) and 17110 (BORSH wRPC, what the ingester + chat indexer use) are live and
  # bound to the host. --utxoindex is required by the ingester. Data persists in a named volume.
  kaspad:
    container_name: kaspad
    image: supertypo/rusty-kaspad:latest
    restart: unless-stopped
    network_mode: "host"
    stop_grace_period: 30s
    volumes:
      - kaspad-data:/app/data

  # --- Postgres: KaPosts + broadcast tables --------------------------------------------
  kachat-db:
    container_name: kachat-db
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 1G
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGPORT: ${DB_PORT}
    network_mode: "host"
    command: -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.max=10000 -c pg_stat_statements.track=all
    volumes:
      - kachat-db-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -p ${DB_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- The KaChat app: ingester + processor + webserver + chat indexer + admin ---------
  kachat-app:
    container_name: kachat-app
    build:
      context: ../../..
      dockerfile: docker/kachat/Dockerfile.kachat-app
      network: host
    restart: unless-stopped
    network_mode: "host"
    environment:
      # Node + network — points at the bundled kaspad on this host (BORSH wRPC 17110).
      KASPA_NODE_ADDRESS: ${KASPA_NODE_ADDRESS}
      KASPA_NODE_PORT: ${KASPA_NODE_PORT}
      NETWORK: ${NETWORK}
      # Database (shared kachat-db on localhost).
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      # Service ports.
      SKI_PORT: ${SKI_PORT}
      WEBSERVER_PORT: ${WEBSERVER_PORT}
      ADMIN_PORT: ${ADMIN_PORT}
      CHAT_API_PORT: ${CHAT_API_PORT}
      # Chat (kasia) indexer config, read directly from env.
      KASPA_NODE_WBORSH_URL: ws://${KASPA_NODE_ADDRESS}:${KASPA_NODE_PORT}
      NETWORK_TYPE: ${NETWORK}
      KASIA_INDEXER_DB_ROOT: /app/data
      KASIA_API_BIND: 0.0.0.0:${CHAT_API_PORT}
      # Push notifications DISABLED by default (self-host has no Apple/Firebase credentials).
      # Registration still works; delivery is a no-op until you add your own keys and fill these.
      APNS_TEAM_ID: ""
      APNS_KEY_ID: ""
      APNS_TOPIC: ""
      APNS_KEY_PATH: ""
      APNS_ENVIRONMENT: production
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_SERVICE_ACCOUNT_PATH: ""
      # Shared secret guarding the internal push-injection endpoints (generated by install.sh).
      INTERNAL_PUSH_SECRET: ${INTERNAL_PUSH_SECRET}
      RUST_LOG: info
    volumes:
      - kachat-chat-data:/app/data
    depends_on:
      kachat-db:
        condition: service_healthy
      kaspad:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${WEBSERVER_PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # --- Optional: HTTPS front door (only started when the 'proxy' profile is enabled) ----
  # Admin UI on :81 (default login admin@example.com / changeme — change it immediately).
  # Point proxy hosts at host.docker.internal:${WEBSERVER_PORT} (REST) and :${CHAT_API_PORT} (chat).
  nginx-proxy-manager:
    profiles: ["proxy"]
    container_name: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt

  # --- Optional: Docker monitoring UI (only started when the 'monitor' profile is enabled)
  # Watch every container's health, logs, CPU/mem at http://localhost:9000 (set an admin
  # password on first visit).
  portainer:
    profiles: ["monitor"]
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

volumes:
  kaspad-data:
  kachat-db-data:
  kachat-chat-data:
  npm-data:
  npm-letsencrypt:
  portainer-data:
