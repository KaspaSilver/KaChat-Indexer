# KaChat Indexer — two containers: Postgres (its own container, so the DB is never at the
# mercy of an app crash) + one app container running the block ingester, the KaChat
# processor/webserver/admin, and the chat indexer under supervisord.
# Per-service health is in the admin GUI (Dashboard → Services). Run: docker compose up -d --build
#
# NOTE: the Postgres role/database names in .env (DB_USER/DB_NAME) are internal credentials,
# never shown in Portainer or used by the app — left as-is so data is preserved across renames.
name: kachat

services:
  kachat-db:
    profiles: ["public-indexer"]
    container_name: kachat-db
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 4G
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGPORT: ${DB_PORT}
    network_mode: "host"
    command: -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.max=10000 -c pg_stat_statements.track=all -c pg_stat_statements.save=on
    volumes:
      - /var/kachat-db/:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kachat-app:
    profiles: ["public-indexer"]
    container_name: kachat-app
    build:
      context: ../..
      dockerfile: docker/kachat/Dockerfile.kachat-app
    restart: unless-stopped
    network_mode: "host"
    environment:
      # node + network
      KASPA_NODE_ADDRESS: ${KASPA_NODE_ADDRESS}
      KASPA_NODE_PORT: ${KASPA_NODE_PORT}
      NETWORK: ${NETWORK}
      # database (shared kachat-db container on localhost)
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      # service ports
      SKI_PORT: ${SKI_PORT}
      WEBSERVER_PORT: ${WEBSERVER_PORT}
      ADMIN_PORT: ${ADMIN_PORT}
      CHAT_API_PORT: ${CHAT_API_PORT}
      # chat indexer (kasia) config, read directly from env
      KASPA_NODE_WBORSH_URL: ws://${KASPA_NODE_ADDRESS}:${KASPA_NODE_PORT}
      NETWORK_TYPE: ${NETWORK}
      KASIA_INDEXER_DB_ROOT: /app/data
      KASIA_API_BIND: 0.0.0.0:${CHAT_API_PORT}
      # push notifications (APNs). The .p8 auth key lives on the mounted data volume; Team/Key
      # IDs are not secret. Set APNS_ENVIRONMENT=sandbox for Xcode debug builds (prod = TestFlight/
      # App Store). Empty APNS_* disables delivery (registration still works).
      APNS_TEAM_ID: RP4Z22SFSD
      APNS_KEY_ID: C757C5GCQB
      APNS_TOPIC: com.kachat.app
      APNS_KEY_PATH: /app/data/apns/AuthKey_C757C5GCQB.p8
      APNS_ENVIRONMENT: production
      # shared secret guarding the internal broadcast/KaPosts push-injection endpoints
      INTERNAL_PUSH_SECRET: ${INTERNAL_PUSH_SECRET}
      RUST_LOG: info
    volumes:
      - /var/kachat-chat-data:/app/data
    depends_on:
      kachat-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${WEBSERVER_PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
