# KaChat Indexer — two containers: Postgres (its own container, so the DB is never at the
# mercy of an app crash) + one app container running the block ingester, the KaChat
# processor/webserver/admin, and the chat indexer under supervisord.
# Per-service health is in the admin GUI (Dashboard → Services). Run: docker compose up -d --build
#
# NOTE: the Postgres role/database names in .env (DB_USER/DB_NAME) are internal credentials,
# never shown in Portainer or used by the app — left as-is so data is preserved across renames.
name: kachat

services:
  kachat-db:
    profiles: ["public-indexer"]
    container_name: kachat-db
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 4G
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGPORT: ${DB_PORT}
    network_mode: "host"
    command: -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.max=10000 -c pg_stat_statements.track=all -c pg_stat_statements.save=on
    volumes:
      - /var/kachat-db/:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kachat-app:
    profiles: ["public-indexer"]
    container_name: kachat-app
    build:
      context: ../..
      dockerfile: docker/kachat/Dockerfile.kachat-app
      # Build on the host network so the utoipa-swagger-ui build script can reliably resolve
      # codeload.github.com (the default build network intermittently fails DNS on this box).
      network: host
    restart: unless-stopped
    network_mode: "host"
    # Give the chat indexer's fjall store time to flush on recreate/stop. Must EXCEED the
    # chat program's stopwaitsecs (supervisord.conf) so supervisord can shut chat down cleanly
    # before Docker SIGKILLs the container — a kill mid-compaction corrupts the LSM metadata
    # partition (see docs/RECOVERY-chat-metadata.md).
    stop_grace_period: 60s
    environment:
      # node + network
      KASPA_NODE_ADDRESS: ${KASPA_NODE_ADDRESS}
      KASPA_NODE_PORT: ${KASPA_NODE_PORT}
      NETWORK: ${NETWORK}
      # database (shared kachat-db container on localhost)
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      # service ports
      SKI_PORT: ${SKI_PORT}
      WEBSERVER_PORT: ${WEBSERVER_PORT}
      ADMIN_PORT: ${ADMIN_PORT}
      CHAT_API_PORT: ${CHAT_API_PORT}
      # chat indexer (kasia) config, read directly from env
      KASPA_NODE_WBORSH_URL: ws://${KASPA_NODE_ADDRESS}:${KASPA_NODE_PORT}
      NETWORK_TYPE: ${NETWORK}
      KASIA_INDEXER_DB_ROOT: /app/data
      KASIA_API_BIND: 0.0.0.0:${CHAT_API_PORT}
      # push notifications (APNs). The .p8 auth key lives on the mounted data volume; Team/Key
      # IDs are not secret. Set APNS_ENVIRONMENT=sandbox for Xcode debug builds (prod = TestFlight/
      # App Store). Empty APNS_* disables delivery (registration still works).
      APNS_TEAM_ID: RP4Z22SFSD
      APNS_KEY_ID: C757C5GCQB
      APNS_TOPIC: com.kachat.app
      APNS_KEY_PATH: /app/data/apns/AuthKey_C757C5GCQB.p8
      APNS_ENVIRONMENT: production
      # push notifications (FCM / Android). The Firebase *service-account* JSON lives on the
      # mounted data volume (Firebase console → Project settings → Service accounts → Generate new
      # private key). Empty FCM_* disables Android delivery (registration still works). The
      # project id is not secret; the JSON holds the private key, so it stays on the volume only.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_SERVICE_ACCOUNT_PATH: /app/data/fcm/service-account.json
      # shared secret guarding the internal broadcast/KaPosts push-injection endpoints
      INTERNAL_PUSH_SECRET: ${INTERNAL_PUSH_SECRET}
      # LibreTranslate base URL for the /translate endpoint (sibling container on host loopback).
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://127.0.0.1:5000}
      RUST_LOG: info
    volumes:
      - /var/kachat-chat-data:/app/data
      # Merged store (4.12M Kasia history + local kchat: data) imported from kachat.app, overlaid
      # onto the chat-indexer's data dir. apns/ + fcm/ keys still come from the base mount above.
      - /home/vahome/kachat-import/mainnet:/app/data/mainnet
    depends_on:
      kachat-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${WEBSERVER_PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Self-hosted translation engine behind the webserver's /translate endpoint. Bridge network with
  # a loopback port publish so the host-network kachat-app reaches it at http://127.0.0.1:5000.
  # LT_LOAD_ONLY preloads a modest language set (each pair is a model in memory) — expand only as
  # RAM headroom allows. mem_limit caps it so it can never OOM-pressure the Kaspa node.
  libretranslate:
    profiles: ["public-indexer"]
    container_name: libretranslate
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    # Run as root so it can write models to the root-owned named volume (the image's non-root user
    # uid 1032 can't; the argos dir isn't baked into the image, so Docker doesn't chown the volume).
    # Self-healing on fresh installs — no manual chown needed. Container is loopback-only + isolated.
    user: "0:0"
    ports:
      - "127.0.0.1:5000:5000"
    mem_limit: 4g
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,es,pt,fr,de,ru,zh,ja,ko,ar,vi}
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: "4"
    volumes:
      - libretranslate-models:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages', timeout=5).status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  libretranslate-models:
